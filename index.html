<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<title>家計ノート</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="app-header__title">
      <span class="app-header__mark">帳</span>
      <h1>家計ノート</h1>
    </div>
    <div class="app-header__summary">
      <div>
        <span class="app-header__label">今月の収支</span>
        <span id="headerBalance" class="app-header__balance">¥0</span>
      </div>
      <div>
        <span class="app-header__label">総資産</span>
        <span id="headerAssets" class="app-header__balance app-header__balance--assets">¥0</span>
      </div>
    </div>
  </header>

  <main class="screens">

    <!-- 記録画面 -->
    <section id="screen-record" class="screen active">
      <form id="txForm" class="ledger-form">
        <div class="type-toggle" role="tablist">
          <button type="button" class="type-toggle__btn is-active" data-type="expense">支出</button>
          <button type="button" class="type-toggle__btn" data-type="income">収入</button>
        </div>

        <label class="field">
          <span class="field__label">金額</span>
          <div class="field__amount">
            <span class="field__yen">¥</span>
            <input type="number" id="txAmount" inputmode="numeric" min="0" step="1" placeholder="0" required>
          </div>
        </label>

        <label class="field">
          <span class="field__label">日付</span>
          <input type="date" id="txDate" required>
        </label>

        <div class="field">
          <span class="field__label">カテゴリ</span>
          <div id="txCategoryList" class="chip-list"></div>
          <button type="button" id="addCategoryBtn" class="link-btn">+ カテゴリを追加</button>
        </div>

        <label class="field">
          <span class="field__label">メモ(任意)</span>
          <input type="text" id="txMemo" placeholder="例)スーパーで買い物">
        </label>

        <input type="hidden" id="txEditId">
        <div class="form-actions">
          <button type="submit" id="txSubmitBtn" class="btn btn--primary">記録する</button>
          <button type="button" id="txCancelEditBtn" class="btn btn--ghost" hidden>編集をやめる</button>
        </div>
      </form>
    </section>

    <!-- 一覧画面 -->
    <section id="screen-list" class="screen">
      <div class="screen-head">
        <h2>入出金の一覧</h2>
        <select id="listMonthFilter" class="month-select"></select>
      </div>
      <div class="month-summary">
        <div><span>収入</span><strong id="listIncomeTotal">¥0</strong></div>
        <div><span>支出</span><strong id="listExpenseTotal">¥0</strong></div>
        <div><span>差引</span><strong id="listBalanceTotal">¥0</strong></div>
      </div>
      <ul id="txList" class="ledger-list"></ul>
      <p id="txListEmpty" class="empty-note" hidden>この月の記録はまだありません。</p>
    </section>

    <!-- 資産画面 -->
    <section id="screen-assets" class="screen">
      <div class="screen-head">
        <h2>資産の記録</h2>
      </div>

      <div class="asset-total-card">
        <span class="asset-total-card__label">現在の総資産</span>
        <span id="assetTotalValue" class="asset-total-card__value">¥0</span>
        <div class="asset-total-card__breakdown">
          <span>積立NISA <strong id="assetNisaValue">¥0</strong></span>
          <span>iDeCo <strong id="assetIdecoValue">¥0</strong></span>
        </div>
      </div>

      <form id="assetForm" class="ledger-form">
        <label class="field">
          <span class="field__label">記録日</span>
          <input type="date" id="assetDate" required>
        </label>
        <label class="field">
          <span class="field__label">積立NISA 評価額</span>
          <div class="field__amount">
            <span class="field__yen">¥</span>
            <input type="number" id="assetNisa" inputmode="numeric" min="0" step="1" placeholder="0" required>
          </div>
        </label>
        <label class="field">
          <span class="field__label">iDeCo 評価額</span>
          <div class="field__amount">
            <span class="field__yen">¥</span>
            <input type="number" id="assetIdeco" inputmode="numeric" min="0" step="1" placeholder="0" required>
          </div>
        </label>
        <input type="hidden" id="assetEditId">
        <div class="form-actions">
          <button type="submit" id="assetSubmitBtn" class="btn btn--primary">記録する</button>
          <button type="button" id="assetCancelEditBtn" class="btn btn--ghost" hidden>編集をやめる</button>
        </div>
      </form>

      <h3 class="section-sub-title">資産の推移</h3>
      <div class="chart-card">
        <canvas id="assetChart" height="220"></canvas>
      </div>

      <h3 class="section-sub-title">記録した履歴</h3>
      <ul id="assetList" class="ledger-list"></ul>
      <p id="assetListEmpty" class="empty-note" hidden>まだ記録がありません。</p>
    </section>

    <!-- レポート画面 -->
    <section id="screen-report" class="screen">
      <div class="screen-head">
        <h2>カテゴリ別レポート</h2>
        <select id="reportMonthFilter" class="month-select"></select>
      </div>
      <div class="chart-card">
        <canvas id="categoryChart" height="240"></canvas>
      </div>
      <ul id="categoryBreakdown" class="category-breakdown"></ul>
      <p id="reportEmpty" class="empty-note" hidden>この月の支出記録はまだありません。</p>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tabbar__btn is-active" data-screen="record">
      <span class="tabbar__icon">✎</span><span>記録</span>
    </button>
    <button class="tabbar__btn" data-screen="list">
      <span class="tabbar__icon">☰</span><span>一覧</span>
    </button>
    <button class="tabbar__btn" data-screen="assets">
      <span class="tabbar__icon">￥</span><span>資産</span>
    </button>
    <button class="tabbar__btn" data-screen="report">
      <span class="tabbar__icon">◐</span><span>レポート</span>
    </button>
  </nav>

</div>

<!-- カテゴリ追加モーダル -->
<div id="categoryModal" class="modal" hidden>
  <div class="modal__panel">
    <h3>カテゴリを追加</h3>
    <label class="field">
      <span class="field__label">カテゴリ名</span>
      <input type="text" id="newCategoryName" placeholder="例)交際費">
    </label>
    <div class="form-actions">
      <button type="button" id="saveCategoryBtn" class="btn btn--primary">追加する</button>
      <button type="button" id="closeCategoryModalBtn" class="btn btn--ghost">閉じる</button>
    </div>
    <div class="modal__manage">
      <h4>既存のカテゴリ</h4>
      <ul id="categoryManageList" class="category-manage-list"></ul>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
