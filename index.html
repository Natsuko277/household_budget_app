<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<title>家計ノート</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="app-header__title">
      <span class="app-header__mark">帳</span>
      <h1>家計ノート</h1>
    </div>
    <div class="app-header__summary">
      <div>
        <span class="app-header__label">今月の収支</span>
        <span id="headerBalance" class="app-header__balance">¥0</span>
      </div>
      <div>
        <span class="app-header__label">総資産</span>
        <span id="headerAssets" class="app-header__balance app-header__balance--assets">¥0</span>
      </div>
    </div>
  </header>

  <main class="screens">

    <!-- 記録画面 -->
    <section id="screen-record" class="screen active">
      <form id="txForm" class="ledger-form">
        <div class="type-toggle" role="tablist">
          <button type="button" class="type-toggle__btn is-active" data-type="expense">支出</button>
          <button type="button" class="type-toggle__btn" data-type="income">収入</button>
        </div>

        <label class="field">
          <span class="field__label">金額</span>
          <div class="field__amount">
            <span class="field__yen">¥</span>
            <input type="number" id="txAmount" inputmode="numeric" min="0" step="1" placeholder="0" required>
          </div>
        </label>

        <label class="field">
          <span class="field__label">日付</span>
          <input type="date" id="txDate" required>
        </label>

        <div class="field">
          <span class="field__label">カテゴリ</span>
          <div id="txCategoryList" class="chip-list"></div>
          <button type="button" id="addCategoryBtn" class="link-btn">+ カテゴリを追加</button>
        </div>

        <label class="field">
          <span class="field__label">メモ(任意)</span>
          <input type="text" id="txMemo" placeholder="例)スーパーで買い物">
        </label>

        <input type="hidden" id="txEditId">
        <div class="form-actions">
          <button type="submit" id="txSubmitBtn" class="btn btn--primary">記録する</button>
